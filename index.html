<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>텔레그램 시황 피드 · 인터랙션 프로토타입</title>
<style>
  :root{
    --tg:#2aabee; --tg-deep:#1c93d1;
    --up:#f04452; --down:#3485fa;
    --sub:#8b95a1; --line:#eceef1; --hot:#ff4d4f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:#0e1116;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;color:#191f28;
  }
  /* 원본 스크린샷을 그대로 배경으로 사용 */
  .phone{position:relative;width:100%;max-width:430px;}
  .phone>img.bg{display:block;width:100%;height:auto;}
  @media(min-width:480px){ body{align-items:center;padding:20px 0;} }

  /* === Daily 시황 영역 위에 얹는 텔레그램 오버레이 === */
  /* 좌표는 원본 18:00 박스 위치에 맞춤 (이미지 비율 기준 %) */
  .tg-overlay{
    position:absolute;
    left:2.6%; width:94.8%;
    top:64.4%; height:6.3%;
    background:#ffffff;border-radius:16px;cursor:pointer;
    display:flex;align-items:center;gap:8px;padding:0 14px;
    border:1.5px solid #e6f4fc;
    box-shadow:0 4px 14px rgba(42,171,238,.18);
    overflow:hidden;
    transition:transform .12s ease;
  }
  .tg-overlay:active{transform:scale(.985);}
  .tg-ic{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#36b3f0,#1c93d1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .tg-body{flex:1;min-width:0;}
  .tg-top{display:flex;align-items:center;gap:6px;}
  .tg-name{font-size:11px;font-weight:800;color:#1c93d1;}
  .tg-live{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:800;color:var(--hot);background:#fff0f0;padding:1px 6px;border-radius:20px;}
  .pulse{width:5px;height:5px;border-radius:50%;background:var(--hot);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,79,.6);}70%{box-shadow:0 0 0 6px rgba(255,77,79,0);}100%{box-shadow:0 0 0 0 rgba(255,77,79,0);}}
  .tg-upd{margin-left:auto;font-size:9px;color:var(--sub);}
  .tg-head-row{font-size:13px;font-weight:700;color:#191f28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .tg-head-row b{color:var(--up);}
  .tg-cta{flex:none;font-size:14px;color:#c4cdd5;}

  /* fluid 글자 크기: 화면이 작아도 비율 유지 */
  @media(max-width:380px){ .tg-head-row{font-size:12px;} }

  /* === 바텀시트 === */
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:#f7f9fb;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);z-index:50;display:flex;flex-direction:column;}
  .sheet.show{transform:translateY(0);}
  .grab{padding:10px 0 6px;display:flex;justify-content:center;flex:none;cursor:grab;}
  .grab span{width:40px;height:4px;border-radius:4px;background:#d1d6db;}
  .sheet-h{padding:2px 18px 12px;flex:none;border-bottom:1px solid var(--line);background:#fff;}
  .sheet-h .row{display:flex;align-items:center;gap:8px;}
  .sheet-h h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .sheet-h .live{font-size:10px;font-weight:800;color:var(--hot);background:#fff0f0;padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .sheet-h .close{margin-left:auto;font-size:22px;color:#888;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .sheet-h p{margin:7px 0 11px;font-size:12px;color:var(--sub);}
  .filters{display:flex;gap:7px;overflow-x:auto;}
  .filters::-webkit-scrollbar{display:none;}
  .fchip{flex:none;font-size:12px;font-weight:700;padding:7px 13px;border-radius:18px;background:#f2f4f6;color:#666;cursor:pointer;}
  .fchip.active{background:#191f28;color:#fff;}

  .timeline{flex:1;overflow-y:auto;padding:14px 16px 30px;}
  .tl-day{font-size:12px;font-weight:800;color:var(--sub);margin:6px 0 12px;text-align:center;position:sticky;top:0;}
  .tl-day span{background:#e9edf1;padding:4px 12px;border-radius:20px;}
  .tl-item{display:flex;gap:12px;position:relative;}
  .tl-left{flex:none;width:46px;text-align:right;padding-top:2px;}
  .tl-time{font-size:12px;font-weight:800;color:#191f28;}
  .tl-ago{font-size:9px;color:var(--sub);margin-top:1px;}
  .tl-axis{flex:none;width:14px;display:flex;flex-direction:column;align-items:center;position:relative;}
  .tl-node{width:11px;height:11px;border-radius:50%;background:#cfd6dd;border:2px solid #fff;margin-top:4px;z-index:2;}
  .tl-node.hot{background:var(--hot);box-shadow:0 0 0 4px rgba(255,77,79,.18);}
  .tl-line{position:absolute;top:4px;bottom:-18px;width:2px;background:#e3e8ec;left:6px;z-index:1;}
  .tl-card{flex:1;background:#fff;border-radius:14px;padding:13px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .tl-card.hot{border:1.5px solid #ffe0e0;}
  .tl-ch{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
  .ch-av{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#36b3f0,#1c93d1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
  .ch-name{font-size:12px;font-weight:800;}
  .ch-verify{color:var(--tg);font-size:11px;}
  .hot-tag{margin-left:auto;font-size:9px;font-weight:800;color:#fff;background:var(--hot);padding:3px 7px;border-radius:6px;}
  .hot-tag.warm{background:#ff8c00;}
  .tl-content{font-size:13.5px;line-height:1.5;font-weight:600;color:#222;}
  .tl-content .hl{background:linear-gradient(transparent 55%,#fff2a8 55%);font-weight:800;}
  .tl-stat{font-size:10.5px;color:var(--sub);margin-top:8px;display:flex;gap:12px;}

  .stock-box{margin-top:11px;background:#f7f9fb;border-radius:12px;padding:10px 11px;}
  .stock-top{display:flex;align-items:center;gap:8px;}
  .stk-logo{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none;}
  .stk-name{font-size:13px;font-weight:800;}
  .stk-code{font-size:10px;color:var(--sub);}
  .stk-price{margin-left:auto;text-align:right;}
  .stk-price .p{font-size:14px;font-weight:800;}
  .stk-price .c{font-size:10.5px;font-weight:700;}
  .up{color:var(--up);} .down{color:var(--down);}
  .stk-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:10px 0;border-radius:10px;border:none;cursor:pointer;}
  .btn.price{background:var(--up);color:#fff;}
  .btn.fav{background:#fff;color:#191f28;border:1.5px solid #e1e5ea;}
  .btn.fav.added{background:#fff5e6;color:#ff8c00;border-color:#ffe0b3;}

  .toast{position:absolute;bottom:12%;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(25,31,40,.94);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .3s;z-index:80;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* A/B 데모 토글 (대조군 = 오버레이 OFF = 원본 그대로) */
  .ab{position:absolute;top:1.5%;right:3%;z-index:35;display:flex;background:rgba(25,31,40,.82);border-radius:20px;padding:3px;}
  .ab button{border:none;background:transparent;color:#9aa3ad;padding:4px 11px;border-radius:16px;font-weight:800;font-size:11px;cursor:pointer;}
  .ab button.on{background:#fff;color:#191f28;}
</style>
</head>
<body>
<div class="phone">
  <img class="bg" src="Screenshot_20260604_183228.jpg" alt="원본 홈 화면" />

  <!-- A/B 데모 토글 -->
  <div class="ab">
    <button id="abA" onclick="setVariant('A')">A안</button>
    <button id="abB" class="on" onclick="setVariant('B')">B안</button>
  </div>

  <!-- Daily 시황 영역에 얹는 텔레그램 카드 (B안) -->
  <div class="tg-overlay" id="overlay" onclick="openSheet()">
    <div class="tg-ic">✈️</div>
    <div class="tg-body">
      <div class="tg-top">

        <div class="fchip" data-f="수주">📝 수주·계약</div>
        <div class="fchip" data-f="M&A">🤝 M&A</div>
        <div class="fchip" data-f="공시">📢 공시</div>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const FEED = [
  {time:"18:31",ago:"2분 전",cat:"수주",hot:"HOT",channel:"반도체속보방",text:"<span class='hl'>한미반도체</span>, 글로벌 메모리社向 HBM 본딩 장비 신규 수주 임박설. 내일 장 시작 전 공시 가능성. 외국계 창구 대량 매수 포착됨.",views:"3.2k",fwd:"412",stock:{name:"한미반도체",code:"042700",price:"148,200",chg:"+12,400 (+9.13%)",up:true,color:"#0a66c2"}},
  {time:"18:26",ago:"7분 전",cat:"급등주",hot:"급등",channel:"2차전지人",text:"<span class='hl'>에코프로비엠</span> 美 대형 OEM과 양극재 장기 공급계약 협의 막바지라는 얘기. IRA 수혜 + 물량 가시성 부각. 지금 호가창 매수 두터움.",views:"2.7k",fwd:"388",stock:{name:"에코프로비엠",code:"247540",price:"212,500",chg:"+18,000 (+9.25%)",up:true,color:"#00b894"}},
  {time:"18:18",ago:"15분 전",cat:"M&A",hot:"HOT",channel:"M&A 인사이드",text:"<span class='hl'>SK이노베이션</span> 배터리 자회사 일부 지분 글로벌 PEF에 매각 검토 중이라는 IB발 루머. 구조조정·재무개선 기대감.",views:"1.9k",fwd:"256",stock:{name:"SK이노베이션",code:"096770",price:"118,900",chg:"+6,700 (+5.97%)",up:true,color:"#e84393"}},
  {time:"18:09",ago:"24분 전",cat:"실적",hot:"warm",channel:"실적 헌터",text:"<span class='hl'>현대로템</span> 폴란드 K2 전차 2차 계약 분기 실적 반영 본격화. 컨센서스 상회 전망. 방산 모멘텀 지속.",views:"1.4k",fwd:"178",stock:{name:"현대로템",code:"064350",price:"58,300",chg:"+2,100 (+3.74%)",up:true,color:"#636e72"}},
  {time:"17:58",ago:"35분 전",cat:"공시",hot:"warm",channel:"공시 알리미",text:"<span class='hl'>알테오젠</span> 글로벌 빅파마와 추가 기술이전(L/O) 계약 관련 조회공시 답변 예정. 마일스톤 규모 주목.",views:"2.1k",fwd:"301",stock:{name:"알테오젠",code:"196170",price:"341,000",chg:"+9,500 (+2.87%)",up:true,color:"#6c5ce7"}},
  {time:"17:44",ago:"49분 전",cat:"급등주",hot:"warm",channel:"테마주 레이더",text:"<span class='hl'>HD현대일렉트릭</span> 美 데이터센터 전력 인프라 발주 확대 수혜. 변압기 슈퍼사이클 장기화 의견.",views:"1.1k",fwd:"142",stock:{name:"HD현대일렉트릭",code:"267260",price:"412,000",chg:"+14,000 (+3.52%)",up:true,color:"#0984e3"}},
  {time:"17:30",ago:"1시간 전",cat:"수주",hot:"",channel:"반도체속보방",text:"<span class='hl'>이수페타시스</span> 북미 AI 가속기향 고다층 MLB 신규 라인 풀가동설. 4분기 가이던스 상향 가능성.",views:"980",fwd:"118",stock:{name:"이수페타시스",code:"007660",price:"61,800",chg:"+1,600 (+2.66%)",up:true,color:"#d63031"}},
  {time:"17:12",ago:"1시간 전",cat:"실적",hot:"",channel:"실적 헌터",text:"<span class='hl'>JYP Ent.</span> 신인 그룹 글로벌 초동 호조 + 일본 돔투어 매출 반영. 4분기 어닝 서프라이즈 기대 코멘트.",views:"760",fwd:"89",stock:{name:"JYP Ent.",code:"035900",price:"72,400",chg:"-900 (-1.23%)",up:false,color:"#fd79a8"}},
  {time:"16:55",ago:"1시간 전",cat:"M&A",hot:"",channel:"M&A 인사이드",text:"<span class='hl'>두산로보틱스</span> 해외 협동로봇 업체 인수 통한 북미 채널 확장 검토설. CES 신제품 라인업 주목.",views:"640",fwd:"71",stock:{name:"두산로보틱스",code:"454910",price:"88,200",chg:"+1,200 (+1.38%)",up:true,color:"#f0932b"}},
  {time:"16:38",ago:"2시간 전",cat:"공시",hot:"",channel:"공시 알리미",text:"<span class='hl'>리노공업</span> 자사주 매입 후 소각 결정 임박설. 주주환원 강화 기조. 외인 지분율 점진 확대 중.",views:"520",fwd:"58",stock:{name:"리노공업",code:"058470",price:"198,000",chg:"+3,500 (+1.80%)",up:true,color:"#00cec9"}},
];

let currentFilter = "전체";
function render(){
  const tl = document.getElementById('timeline');
  const list = FEED.filter(f => currentFilter==="전체" || f.cat===currentFilter);
  let html = `<div class="tl-day"><span>오늘 · 6월 4일 (목)</span></div>`;
  if(list.length===0){ html += `<div style="text-align:center;color:#8b95a1;padding:40px 0;font-size:13px;">해당 분류의 핫한 정보가 아직 없어요</div>`; }
  list.forEach((f,i)=>{
    const isHot = f.hot==="HOT" || f.hot==="급등";
    const hotTag = f.hot==="" ? "" : `<span class="hot-tag ${f.hot==='warm'?'warm':''}">${f.hot==='warm'?'관심':(f.hot==='급등'?'⚡급등':'🔥HOT')}</span>`;
    const last = i===list.length-1;
    html += `
    <div class="tl-item">
      <div class="tl-left"><div class="tl-time">${f.time}</div><div class="tl-ago">${f.ago}</div></div>
      <div class="tl-axis"><div class="tl-node ${isHot?'hot':''}"></div>${last?'':'<div class="tl-line"></div>'}</div>
      <div class="tl-card ${isHot?'hot':''}">
        <div class="tl-ch"><div class="ch-av">✈️</div><div class="ch-name">${f.channel}</div><div class="ch-verify">✔</div>${hotTag}</div>
        <div class="tl-content">${f.text}</div>
        <div class="tl-stat"><span>🔥 ${f.views} 조회</span><span>↗ ${f.fwd} 공유</span></div>
        <div class="stock-box">
          <div class="stock-top">
            <div class="stk-logo" style="background:${f.stock.color}">${f.stock.name.slice(0,1)}</div>
            <div><div class="stk-name">${f.stock.name}</div><div class="stk-code">${f.stock.code}</div></div>
            <div class="stk-price"><div class="p">${f.stock.price}</div><div class="c ${f.stock.up?'up':'down'}">${f.stock.up?'▲':'▼'} ${f.stock.chg}</div></div>
          </div>
          <div class="stk-actions">
            <button class="btn price" onclick="event.stopPropagation();viewPrice('${f.stock.name}')">현재가 보기</button>
            <button class="btn fav" onclick="event.stopPropagation();addFav(this,'${f.stock.name}')">+ 관심종목</button>
          </div>
        </div>
      </div>
    </div>`;
  });
  tl.innerHTML = html;
}

document.getElementById('filters').addEventListener('click', e=>{
  const c = e.target.closest('.fchip'); if(!c) return;
  document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); currentFilter = c.dataset.f; render();
  document.getElementById('timeline').scrollTop = 0;
});

const backdrop = document.getElementById('backdrop');
const sheet = document.getElementById('sheet');
function openSheet(){ render(); backdrop.classList.add('show'); sheet.classList.add('show'); }
function closeSheet(){ backdrop.classList.remove('show'); sheet.classList.remove('show'); }

let startY=0, curY=0, dragging=false;
const grab = document.getElementById('grab');
function dragStart(y){ startY=y; dragging=true; sheet.style.transition='none'; }
function dragMove(y){ if(!dragging) return; curY=Math.max(0,y-startY); sheet.style.transform=`translateY(${curY}px)`; }
function dragEnd(){ if(!dragging) return; dragging=false; sheet.style.transition=''; if(curY>140){ closeSheet(); } sheet.style.transform=''; curY=0; }
grab.addEventListener('touchstart',e=>dragStart(e.touches[0].clientY));
grab.addEventListener('touchmove',e=>dragMove(e.touches[0].clientY));
grab.addEventListener('touchend',dragEnd);
grab.addEventListener('mousedown',e=>{dragStart(e.clientY);document.onmousemove=ev=>dragMove(ev.clientY);document.onmouseup=()=>{dragEnd();document.onmousemove=null;};});

let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
function viewPrice(name){ toast(`📈 ${name} 현재가 화면으로 이동`); }
function addFav(btn,name){ if(btn.classList.contains('added')){ btn.classList.remove('added'); btn.textContent='+ 관심종목'; toast(`${name} 관심종목에서 제외`); } else { btn.classList.add('added'); btn.textContent='★ 관심추가됨'; toast(`⭐ ${name} 관심종목에 추가됨`); } }

function setVariant(v){
  document.getElementById('abA').classList.toggle('on', v==='A');
  document.getElementById('abB').classList.toggle('on', v==='B');
  document.getElementById('overlay').style.display = v==='B' ? 'flex' : 'none';
  if(v==='A') closeSheet();
}

/* 상단 헤드라인 회전 + 갱신 시간 시뮬레이션 */
const heads = [
  "<b>한미반도체</b> HBM 신규 장비 수주 임박설… 외국계 매수",
  "<b>에코프로비엠</b> 美 대형 OEM 공급계약 막바지 루머 확산",
  "<b>SK이노베이션</b> 배터리 자회사 지분 매각 검토 IB발 루머",
  "<b>알테오젠</b> 글로벌 빅파마 추가 기술이전 조회공시 예정",
];
let hi=0;
setInterval(()=>{ hi=(hi+1)%heads.length; const el=document.getElementById('headline'); el.style.opacity=0; setTimeout(()=>{el.innerHTML=heads[hi]; el.style.opacity=1;},250); }, 3500);
document.getElementById('headline').style.transition='opacity .25s';
let mins=0;
setInterval(()=>{ mins=(mins+1)%10; document.getElementById('updTime').textContent = mins===0?'방금 갱신':`${mins}분 전 갱신`; },1000);
</script>
</body>
